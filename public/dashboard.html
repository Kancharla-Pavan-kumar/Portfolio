<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - InsForge Auth</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
    .dashboard-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; text-align: center; }
    button { padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <h2>Secure Dashboard</h2>
    <p>Welcome! You are securely logged in as:</p>
    <p><strong id="user-email">Loading...</strong></p>
    <button id="logout-btn">Log Out</button>
  </div>

  <script type="module">
    import { logout } from './auth.js';

    document.getElementById('logout-btn').addEventListener('click', () => {
      logout();
    });
  </script>
</body>
</html>
